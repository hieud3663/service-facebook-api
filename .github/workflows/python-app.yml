name: Deploy Backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-production
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: service-facebook-api
  SERVICES_DIR: services
  SERVICE_ENV_DIR: /opt/service-facebook-api/env

jobs:
  deploy:
    name: Deploy on VPS
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Prepare runner workspace
        run: |
          set -euo pipefail

          if [ -d "$GITHUB_WORKSPACE" ]; then
            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
              sudo find "$GITHUB_WORKSPACE" -type d -name "__pycache__" -prune -exec rm -rf {} +
              sudo find "$GITHUB_WORKSPACE" -type f -name "*.pyc" -delete
              sudo rm -rf "$GITHUB_WORKSPACE/logs"
            else
              chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
              find "$GITHUB_WORKSPACE" -type d -name "__pycache__" -prune -exec rm -rf {} + 2>/dev/null || true
              find "$GITHUB_WORKSPACE" -type f -name "*.pyc" -delete 2>/dev/null || true
              rm -rf "$GITHUB_WORKSPACE/logs" 2>/dev/null || true
            fi
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Load environment files
        run: |
          set -euo pipefail

          ENV_DIR="${SERVICE_FACEBOOK_ENV_DIR:-${SERVICE_ENV_DIR}}"
          ROOT_ENV_FILE_PATH="${ROOT_ENV_FILE_PATH:-$ENV_DIR/root.env}"
          if [ ! -f "$ROOT_ENV_FILE_PATH" ] && [ -f "$ENV_DIR/.env" ]; then
            ROOT_ENV_FILE_PATH="$ENV_DIR/.env"
          fi
          API_ENV_FILE_PATH="${API_SERVICE_ENV_FILE_PATH:-$ENV_DIR/api-service.env}"
          WEBHOOK_ENV_FILE_PATH="${WEBHOOK_SERVICE_ENV_FILE_PATH:-$ENV_DIR/webhook-service.env}"
          CORE_ENV_FILE_PATH="${CORE_SERVICE_ENV_FILE_PATH:-$ENV_DIR/core-service.env}"
          RETRY_ENV_FILE_PATH="${RETRY_SERVICE_ENV_FILE_PATH:-$ENV_DIR/retry-service.env}"

          copy_private_file() {
            source_path="$1"
            target_path="$2"

            if [ ! -f "$source_path" ]; then
              echo "::error::Missing environment file on VPS: $source_path"
              exit 1
            fi

            mkdir -p "$(dirname "$target_path")"

            if [ -r "$source_path" ]; then
              install -m 600 "$source_path" "$target_path"
              return
            fi

            if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
              sudo install -m 600 -o "$(id -u)" -g "$(id -g)" "$source_path" "$target_path"
              return
            fi

            echo "::error::Runner user cannot read $source_path. Grant read permission or allow passwordless sudo."
            exit 1
          }

          copy_private_file "$ROOT_ENV_FILE_PATH" "$GITHUB_WORKSPACE/.env"
          copy_private_file "$API_ENV_FILE_PATH" "$SERVICES_DIR/api-service/.env"
          copy_private_file "$WEBHOOK_ENV_FILE_PATH" "$SERVICES_DIR/webhook-service/.env"
          copy_private_file "$CORE_ENV_FILE_PATH" "$SERVICES_DIR/core-service/.env"
          copy_private_file "$RETRY_ENV_FILE_PATH" "$SERVICES_DIR/retry-service/.env"

      - name: Check Docker
        run: |
          set -euo pipefail

          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            DOCKER="sudo docker"
          else
            echo "::error::Docker is not installed or the runner user cannot access it. Add the runner user to the docker group or allow passwordless sudo for docker."
            exit 1
          fi

          if $DOCKER compose version >/dev/null 2>&1; then
            exit 0
          fi

          if command -v docker-compose >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker-compose version >/dev/null
            exit 0
          fi

          if command -v sudo >/dev/null 2>&1 && sudo -n docker-compose version >/dev/null 2>&1; then
            exit 0
          fi

          echo "::error::Docker Compose not found. Install the Docker Compose plugin or docker-compose."
          exit 1

      - name: Validate Docker Compose config
        run: |
          set -euo pipefail

          cd "$SERVICES_DIR"

          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            DOCKER="sudo docker"
          else
            echo "::error::Runner user cannot access Docker."
            exit 1
          fi

          if $DOCKER compose version >/dev/null 2>&1; then
            COMPOSE="$DOCKER compose"
          elif command -v docker-compose >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker-compose version >/dev/null 2>&1; then
            COMPOSE="sudo docker-compose"
          else
            echo "::error::Docker Compose not found or cannot access Docker."
            exit 1
          fi

          $COMPOSE config >/dev/null

      - name: Deploy with Docker Compose
        run: |
          set -euo pipefail

          cd "$SERVICES_DIR"

          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            DOCKER="sudo docker"
          else
            echo "::error::Runner user cannot access Docker. Add it to the docker group or allow passwordless sudo for docker."
            exit 1
          fi

          if $DOCKER compose version >/dev/null 2>&1; then
            COMPOSE="$DOCKER compose"
          elif command -v docker-compose >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker-compose version >/dev/null 2>&1; then
            COMPOSE="sudo docker-compose"
          else
            echo "::error::Docker Compose not found or cannot access Docker."
            exit 1
          fi

          export COMPOSE_BAKE=false
          export DOCKER_BUILDKIT=0

          $COMPOSE build api-service
          $COMPOSE build webhook-service
          $COMPOSE build core-service
          $COMPOSE build retry-service
          $COMPOSE build alertmanager
          $COMPOSE build nginx

          $COMPOSE up -d mongodb kafka
          $COMPOSE run --rm --no-deps api-service python manage.py migrate --noinput
          $COMPOSE run --rm --no-deps webhook-service python manage.py migrate --noinput
          $COMPOSE run --rm --no-deps core-service python manage.py migrate --noinput
          $COMPOSE run --rm --no-deps retry-service python manage.py migrate --noinput
          $COMPOSE up -d --no-build --remove-orphans \
            mongodb \
            kafka \
            kafka-ui \
            kafka-exporter \
            prometheus \
            alertmanager \
            api-service \
            api-worker \
            webhook-service \
            core-service \
            core-worker \
            core-retry-worker \
            retry-service \
            retry-worker \
            nginx
          $COMPOSE ps

      - name: Health check
        run: |
          set -euo pipefail

          max_attempts=24
          attempt=0

          while [ "$attempt" -lt "$max_attempts" ]; do
            if curl --max-time 5 -fsS http://localhost:3000/health >/dev/null \
              && curl --max-time 5 -fsS http://localhost:3000/core/health >/dev/null \
              && curl --max-time 5 -fsS http://localhost:3000/retry/health >/dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, retrying in 5s..."
            sleep 5
          done

          echo "::error::Health check failed"

          cd "$SERVICES_DIR"

          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            DOCKER="docker"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            DOCKER="sudo docker"
          else
            exit 1
          fi

          if $DOCKER compose version >/dev/null 2>&1; then
            COMPOSE="$DOCKER compose"
          elif command -v docker-compose >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            COMPOSE="docker-compose"
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker-compose version >/dev/null 2>&1; then
            COMPOSE="sudo docker-compose"
          else
            exit 1
          fi

          $COMPOSE ps || true
          $COMPOSE logs --tail=120 || true
          exit 1

      - name: Cleanup Docker images
        if: always()
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            docker image prune -f
          elif command -v sudo >/dev/null 2>&1 && sudo -n docker info >/dev/null 2>&1; then
            sudo docker image prune -f
          fi

