name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  ci:
    name: Django CI (${{ matrix.service }})
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-service
          - webhook-service
          - core-service
          - retry-service

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

      - name: Validate OpenAPI schema
        if: matrix.service != 'webhook-service'
        run: python manage.py spectacular --file schema.yaml --validate

  compose:
    name: Docker Compose Validation
    runs-on: self-hosted
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose config
        run: |
          cd services
          docker compose config

  deploy:
    name: Deploy on VPS (Self-hosted)
    runs-on: self-hosted
    needs: compose
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop existing containers
        run: |
          cd services
          docker compose down --remove-orphans || true

      - name: Build and start services
        run: |
          cd services
          docker compose up -d --build

      - name: Show container status
        run: |
          cd services
          docker compose ps

      - name: Health check
        run: |
          max_attempts=12
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -fsS http://localhost:3000/health > /dev/null \
              && curl -fsS http://localhost:3000/core/health > /dev/null \
              && curl -fsS http://localhost:3000/retry/health > /dev/null; then
              echo "Application is healthy"
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts failed, retrying in 5s..."
            sleep 5
          done

          echo "Health check failed"
          cd services
          docker compose logs --tail=120
          exit 1

