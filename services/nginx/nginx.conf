upstream api_service {
    server api-service:3002;
}

upstream webhook_service {
    server webhook-service:3001;
}

upstream core_service {
    server core-service:3003;
}

upstream retry_service {
    server retry-service:3004;
}

server {
    listen 80;
    server_name _;

    location /retry/ {
        proxy_pass         http://retry_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────────
    # API Service  →  /api/...
    # ──────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────────
    # Webhook Service  →  /webhook...
    # ──────────────────────────────────────────────
    location /webhook {
        proxy_pass         http://webhook_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────────
    # Core Service  →  /core/...
    # ──────────────────────────────────────────────
    location /core/ {
        proxy_pass         http://core_service;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ──────────────────────────────────────────────
    # Health check
    # ──────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
