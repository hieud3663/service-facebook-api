          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - retry
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
components:
  schemas:
    RetryAttempt:
      type: object
      properties:
        command_id:
          type: string
        event_id:
          type: string
          default: ''
        action_type:
          type: string
          default: ''
        target_id:
          type: string
          default: ''
        status:
          type: string
        retry_count:
          type: integer
          default: 0
        last_failure_type:
          type: string
          default: ''
        last_reason:
          type: string
          default: ''
        next_retry_at:
          type: string
          format: date-time
          nullable: true
        dead_lettered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - command_id
      - status
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
