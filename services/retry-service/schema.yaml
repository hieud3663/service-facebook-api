openapi: 3.0.3
info:
  title: Retry Service
  version: 1.0.0
  description: Consumes send_failed and publishes send_retry or dead_letter.
paths:
  /retry/attempts:
    get:
      operationId: retry_attempts_list
      summary: List retry attempts
      tags:
      - retry
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetryAttempt'
          description: ''
  /retry/attempts/{command_id}:
    get:
      operationId: retry_attempts_retrieve
      summary: Retry attempt detail
      parameters:
      - in: path
        name: command_id
        schema:
          type: string
        required: true
      tags:
      - retry
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetryAttempt'
          description: ''
  /retry/health:
    get:
      operationId: retry_health_retrieve
      summary: Retry service health
      tags:
      - retry
      security:
      - {}
      responses:
        '200':
          description: OK
  /retry/metrics:
    get:
      operationId: retry_metrics_retrieve
      summary: Retry metrics
      tags:
      - retry
      responses:
        '200':
          description: Metrics
  /retry/schema/:
    get:
      operationId: retry_schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
